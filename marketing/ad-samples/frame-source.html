<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--navy:#0b1433;--navy2:#16224d;--gold:#d4a83a;--gold-dark:#9c7a22;--cream:#f6f1e8}
  html,body{margin:0;width:540px;height:960px;overflow:hidden;background:var(--navy);font-family:"Playfair Display",serif}
  #bg{position:absolute;inset:0;background:radial-gradient(110% 70% at 50% 52%,#1d2b5c 0%,#0f1a3f 50%,#0a1129 100%)}
  canvas{position:absolute;inset:0}
  .cap{position:absolute;left:0;right:0;top:150px;text-align:center;padding:0 30px;z-index:5}
  .line{display:block;font-weight:900;font-size:50px;line-height:1.22;color:var(--cream);letter-spacing:-.5px;
        text-shadow:0 4px 0 rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45)}
  .w{display:inline-block;margin:10px 4px 4px;transform-origin:50% 80%}
  .pop{transform:scale(1.1) rotate(-3deg)}
  .hl{background:var(--gold);color:var(--navy);padding:0 14px 4px;border-radius:12px;text-shadow:none;font-style:italic;
      box-shadow:0 6px 0 var(--gold-dark),0 14px 30px rgba(0,0,0,.4)}
  .cta{position:absolute;left:50%;bottom:336px;transform:translateX(-50%);background:var(--gold);color:var(--navy);
       font-family:Inter,sans-serif;font-weight:800;font-size:25px;padding:16px 30px;border-radius:12px;
       box-shadow:0 7px 0 var(--gold-dark),0 18px 40px rgba(0,0,0,.5);z-index:5;white-space:nowrap}
  .lockup{position:absolute;left:0;right:0;bottom:400px;text-align:center;z-index:6;color:var(--cream);text-shadow:0 6px 24px rgba(0,0,0,.5)}
  .lockup .n{font-weight:900;font-size:40px}
  .lockup .p{font-family:Inter,sans-serif;font-weight:600;font-size:20px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-top:4px}
</style>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<div id="bg"></div>
<div class="cap" id="cap"></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene_id = +(new URLSearchParams(location.search).get('s') || 1);
const W = 540, H = 960;
const NAVY = 0x0b1433, GOLD = 0xd4a83a, CREAM = 0xf6f1e8;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);
camera.position.set(0, 0.6, 16.5);
camera.lookAt(0, -2.2, 0);

scene.add(new THREE.HemisphereLight(0xfff4dd, 0x0b1433, 1.0));
const key = new THREE.DirectionalLight(0xfff1d6, 2.6);
key.position.set(4, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f8cff, 1.6);
rim.position.set(-6, 3, -5);
scene.add(rim);

const floor = new THREE.Mesh(new THREE.CircleGeometry(5, 64), new THREE.ShadowMaterial({ opacity: 0.4 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -4.2;
floor.receiveShadow = true;
scene.add(floor);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.05, ...o });
const gold = mat(GOLD, { metalness: 0.85, roughness: 0.27 });
const cream = mat(CREAM);
const navy = mat(NAVY, { roughness: 0.3 });
const navy2 = mat(0x22306a);
const steel = mat(0xc9ced8, { metalness: 0.9, roughness: 0.25 });
const green = mat(0x2fb36b);

function add(mesh, parent = scene) {
  mesh.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  parent.add(mesh);
  return mesh;
}
const rbox = (w, h, d, r, m) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, r), m);
function tex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const SERIF = '"Playfair Display", Georgia, serif', SANS = 'Inter, sans-serif';
function coin(r = 0.55, label = '$') {
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, r * 0.16, 64), gold);
  c.rotation.x = Math.PI / 2; g.add(c);
  const face = new THREE.Mesh(new THREE.CircleGeometry(r * 0.95, 64), mat(0xffffff, { metalness: 0.55, roughness: 0.35, map: tex(512, 512, (x, w) => {
    x.fillStyle = '#d4a83a'; x.fillRect(0, 0, w, w);
    x.strokeStyle = '#0b1433'; x.lineWidth = 5; x.beginPath(); x.arc(256, 256, 222, 0, 7); x.stroke();
    x.fillStyle = '#0b1433'; x.textAlign = 'center'; x.textBaseline = 'middle';
    if (label === 'B&P') {
      x.font = `900 150px ${SERIF}`; x.fillText('B&P', 256, 238);
      x.font = `700 26px ${SERIF}`; x.fillText('BOOKED & PAID', 256, 345);
    } else { x.font = `900 280px ${SERIF}`; x.fillText(label, 256, 270); }
  }) }));
  face.position.z = r * 0.081; g.add(face);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 0.97, r * 0.02, 8, 64), gold);
  ring.position.z = r * 0.085; g.add(ring);
  return g;
}
function check(size = 1, m = green) {
  const g = new THREE.Group();
  const a = rbox(0.18 * size, 0.5 * size, 0.18 * size, 0.06 * size, m); a.position.set(-0.17 * size, -0.05 * size, 0); a.rotation.z = 0.75; g.add(a);
  const b = rbox(0.18 * size, 1.0 * size, 0.18 * size, 0.06 * size, m); b.position.set(0.17 * size, 0.18 * size, 0); b.rotation.z = -0.62; g.add(b);
  return g;
}
function sparkles(n, spread, y0, seed = 1) {
  let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.08 + rnd() * 0.08), mat(i % 2 ? GOLD : CREAM, { emissive: i % 2 ? 0x8a6a10 : 0x555555, emissiveIntensity: 0.6, metalness: 0.5 }));
    m.position.set((rnd() - 0.5) * spread, y0 + (rnd() - 0.5) * 3, (rnd() - 0.5) * 2);
    m.rotation.set(rnd() * 3, rnd() * 3, 0);
    scene.add(m);
  }
}
const cap = document.getElementById('cap');
function caption(lines) {
  cap.innerHTML = lines.map(l => `<span class="line">${l.replace(/\*(.+?)\*/g, '<span class="w hl pop">$1</span>')}</span>`).join('');
}

const scenes = {
  // 1. Still building someone else's business?  → your tools feed coins into the boss's shop
  1() {
    caption(['Still building', '*someone else’s*', 'business?']);
    const shop = new THREE.Group();
    const body = rbox(2.8, 2.2, 1.8, 0.08, cream); body.position.y = 1.1; shop.add(body);
    const roof = rbox(3.1, 0.35, 2.0, 0.08, navy); roof.position.y = 2.35; shop.add(roof);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 0.55), new THREE.MeshBasicMaterial({ map: tex(460, 110, (x, w, h) => {
      x.fillStyle = '#0b1433'; x.fillRect(0, 0, w, h); x.fillStyle = '#d4a83a'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = `900 46px ${SERIF}`; x.fillText('THE BOSS’S SHOP', w / 2, h / 2 + 4);
    }) }));
    sign.position.set(0, 2.0, 0.92); shop.add(sign);
    for (let i = 0; i < 7; i++) {
      const s = rbox(0.4, 0.12, 0.5, 0.04, i % 2 ? cream : gold);
      s.position.set(-1.2 + i * 0.4, 1.62, 1.05); s.rotation.x = 0.5; shop.add(s);
    }
    const door = rbox(0.75, 1.15, 0.08, 0.04, navy2); door.position.set(0.55, 0.58, 0.92); shop.add(door);
    const win = rbox(0.9, 0.7, 0.06, 0.04, mat(0x9fc3ff, { emissive: 0x2a4a8f, emissiveIntensity: 0.4, roughness: 0.1 }));
    win.position.set(-0.65, 0.85, 0.92); shop.add(win);
    shop.position.set(1.0, -4.2, -0.5); shop.rotation.y = -0.35;
    add(shop);
    // your tools
    const wrench = new THREE.Group();
    const handle = rbox(0.28, 1.9, 0.14, 0.06, steel); wrench.add(handle);
    const head = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.13, 16, 32, Math.PI * 1.55), steel); head.position.y = 1.1; head.rotation.z = -0.5; wrench.add(head);
    const sc = new THREE.Group();
    [-1, 1].forEach(sx => {
      const loop = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.07, 12, 32), gold); loop.position.set(sx * 0.24, -0.55, 0); sc.add(loop);
      const blade = rbox(0.1, 1.2, 0.05, 0.03, steel); blade.position.set(sx * 0.06, 0.25, sx * 0.03); blade.rotation.z = sx * 0.22; sc.add(blade);
    });
    sc.position.set(-1.9, -3.2, 1.1); sc.rotation.set(-0.3, 0.2, -0.4); sc.scale.setScalar(1.25); add(sc);
    // coins arcing from your tools into their shop
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      const c = add(coin(0.26));
      c.position.set(-1.9 + t * 2.7, -2.0 + Math.sin(t * Math.PI) * 1.1, 0.7 - t * 0.5);
      c.rotation.set(0.2, 0.5 - t, t * 2);
    }
  },

  // 2. Go solo.  → setup checklist from the Go Solo Plan
  2() {
    caption(['Go *solo.*']);
    const board = new THREE.Group();
    const back = rbox(3.2, 4.0, 0.16, 0.12, mat(0x8a5a2b, { roughness: 0.6 })); board.add(back);
    const items = ['Licensed', 'Insured', 'Priced right', 'First 10 clients'];
    const paper = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 3.5), mat(0xffffff, { roughness: 0.9, map: tex(560, 700, (x, w, h) => {
      x.fillStyle = '#f6f1e8'; x.fillRect(0, 0, w, h);
      x.fillStyle = '#0b1433'; x.textAlign = 'left'; x.textBaseline = 'middle';
      x.font = `900 52px ${SERIF}`; x.fillText('Go Solo Plan', 44, 92);
      x.fillStyle = '#d4a83a'; x.fillRect(44, 132, 140, 6);
      items.forEach((it, i) => {
        const y = 225 + i * 120;
        x.strokeStyle = '#0b1433'; x.lineWidth = 5; x.strokeRect(44, y - 30, 60, 60);
        x.fillStyle = '#0b1433'; x.font = `700 44px ${SANS}`; x.fillText(it, 130, y + 2);
      });
    }) }));
    paper.position.z = 0.09; board.add(paper);
    const clip = rbox(1.2, 0.45, 0.22, 0.1, steel); clip.position.set(0, 2.0, 0.12); board.add(clip);
    // checks popping out of the boxes
    items.forEach((_, i) => {
      if (i > 2) return;
      const c = check(0.55); c.position.set(-1.0, 0.6 - i * 0.6, 0.3); c.scale.setScalar(1 + (2 - i) * 0.12); board.add(c);
    });
    board.position.set(0, -2.15, 0); board.rotation.set(-0.08, 0.28, 0.05);
    add(board);
    sparkles(9, 5.5, -1.5, 5);
  },

  // 3. Get booked.  → week calendar filling with gold BOOKED tiles
  3() {
    caption(['Get *booked.*']);
    const cal = new THREE.Group();
    const base = rbox(4.2, 3.6, 0.3, 0.16, cream); cal.add(base);
    const head = rbox(4.2, 0.75, 0.34, 0.16, navy); head.position.y = 1.45; cal.add(head);
    const ht = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.6), new THREE.MeshBasicMaterial({ transparent: true, map: tex(720, 120, (x, w, h) => {
      x.fillStyle = '#f6f1e8'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `900 66px ${SERIF}`; x.fillText('This week', w / 2, h / 2 + 4);
    }) }));
    ht.position.set(0, 1.45, 0.18); cal.add(ht);
    [[-1.65, 1.6], [-1.6, 1.55]].forEach(([x], k) => {
      const ringm = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.05, 12, 24), steel); ringm.position.set(k ? 1.2 : -1.2, 1.9, 0); ringm.rotation.y = Math.PI / 2; cal.add(ringm);
    });
    const booked = new Set([0, 2, 3, 5, 6, 8, 10, 11]);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
      const i = r * 4 + c, on = booked.has(i);
      const tile = rbox(0.85, 0.72, on ? 0.22 : 0.08, 0.08, on ? gold : mat(0xe4dccb));
      tile.position.set(-1.43 + c * 0.95, 0.65 - r * 0.88, on ? 0.3 + (i === 10 ? 0.35 : 0) : 0.18);
      if (i === 10) tile.scale.setScalar(1.18);
      cal.add(tile);
      if (on) {
        const t = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.3), new THREE.MeshBasicMaterial({ transparent: true, map: tex(260, 100, (x, w, h) => {
          x.fillStyle = '#0b1433'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `800 40px ${SANS}`; x.fillText('BOOKED', w / 2, h / 2 + 2);
        }) }));
        t.position.copy(tile.position); t.position.z += (i === 10 ? 0.15 : 0.12); if (i === 10) t.scale.setScalar(1.18);
        cal.add(t);
      }
    }
    cal.position.set(0, -2.1, 0); cal.rotation.set(-0.1, -0.3, 0.03);
    add(cal);
    sparkles(8, 5.5, -1.6, 9);
  },

  // 4. Get paid.  → phone with deposit / payment notifications
  4() {
    caption(['Get *paid.*']);
    const ph = new THREE.Group();
    const body = rbox(2.3, 4.4, 0.22, 0.3, navy); ph.add(body);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 4.1), new THREE.MeshBasicMaterial({ map: tex(360, 720, (x, w, h) => {
      const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1d2b5c'); g.addColorStop(1, '#0b1433'); x.fillStyle = g; x.fillRect(0, 0, w, h);
      x.fillStyle = '#f6f1e8'; x.textAlign = 'center'; x.font = `900 92px ${SERIF}`; x.fillText('9:41', w / 2, 170);
      x.font = `600 22px ${SANS}`; x.fillStyle = '#c8cfe6'; x.fillText('Saturday', w / 2, 210);
    }) }));
    scr.position.z = 0.115; ph.add(scr);
    ph.position.set(-0.3, -2.25, -0.6); ph.rotation.set(-0.05, -0.32, 0.06);
    add(ph);
    const notes = [['Deposit received', '+$40'], ['Paid in full', '+$120'], ['New booking', 'Sat 10:00']];
    notes.forEach(([a, b], i) => {
      const n = add(rbox(2.9, 0.62, 0.1, 0.14, mat(0xffffff, { map: tex(580, 124, (x, w, h) => {
        x.fillStyle = '#ffffff'; x.beginPath(); x.roundRect(0, 0, w, h, 26); x.fill();
        x.fillStyle = '#d4a83a'; x.beginPath(); x.arc(52, h / 2, 26, 0, 7); x.fill();
        x.fillStyle = '#0b1433'; x.font = `900 30px ${SERIF}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('$', 52, h / 2 + 2);
        x.textAlign = 'left'; x.font = `700 32px ${SANS}`; x.fillText(a, 96, h / 2 + 1);
        x.textAlign = 'right'; x.fillStyle = '#1f8f55'; x.font = `800 32px ${SANS}`; x.fillText(b, w - 26, h / 2 + 1);
      }) })));
      n.position.set((i % 2 ? 0.45 : 0.05), -1.9 - i * 0.72, 0.9 - i * 0.1);
      n.rotation.set(0, -0.12, (i % 2 ? -1 : 1) * 0.04);
    });
    [[-1.9, -3.3, 0.3], [1.9, -1.1, 0.26], [1.7, -3.7, 0.34]].forEach(([x, y, r], i) => {
      const c = add(coin(r)); c.position.set(x, y, 0.6); c.rotation.set(0.3, i - 0.6, 0.3);
    });
  },

  // 5. Your skill. Your business.  → the B&P medallion + Go Solo Plan CTA
  5() {
    caption(['Your skill.', 'Your *business.*']);
    const m = add(coin(1.75, 'B&P'));
    m.position.set(0, -1.6, 0); m.rotation.set(0.05, -0.38, -0.1);
    const lk = document.createElement('div'); lk.className = 'lockup';
    lk.innerHTML = '<div class="n">Go Solo Plan</div><div class="p">Booked &amp; Paid · $37</div>';
    document.body.appendChild(lk);
    const b = document.createElement('div'); b.className = 'cta'; b.textContent = 'Get the plan ↓'; document.body.appendChild(b);
    sparkles(10, 5.5, -1.4, 11);
  },
};

await document.fonts.load('900 50px "Playfair Display"');
await document.fonts.load('700 30px "Playfair Display"');
scenes[scene_id]();
// Keep 3D objects inside the Reels safe zone (top 14% / bottom 35% are covered by app UI)
const fit = { 1: [0.8, -15], 2: [1.0, -15], 3: [1.0, -15], 4: [1.0, -15], 5: [0.48, -50] }[scene_id];
renderer.domElement.style.transform = `translateY(${fit[1]}px) scale(${fit[0]})`;
renderer.render(scene, camera);
window.__done = true;
</script>
</body>
</html>
