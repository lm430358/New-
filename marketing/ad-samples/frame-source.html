<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#0b0820;font-family:"Inter Display","Inter",sans-serif}
  #bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 70%,#3a1d8f 0%,#1a1048 45%,#0b0820 100%)}
  canvas{position:absolute;inset:0}
  .cap{position:absolute;left:0;right:0;top:150px;text-align:center;padding:0 34px;z-index:5}
  .line{display:block;font-weight:900;font-size:50px;line-height:1.08;color:#fff;letter-spacing:-1px;
        text-shadow:0 4px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.45)}
  .w{display:inline-block;margin:0 5px;transform-origin:50% 80%}
  .pop{animation:none;transform:scale(1.12) rotate(-3deg)}
  .hl{background:#ffd23f;color:#1a1048;padding:0 12px;border-radius:14px;text-shadow:none;
      box-shadow:0 6px 0 #c99a00,0 14px 30px rgba(0,0,0,.4)}
  .small{font-size:26px;font-weight:700;color:#c9bfff;margin-top:14px;letter-spacing:0}
  .cta{position:absolute;left:50%;bottom:350px;transform:translateX(-50%);background:#ffd23f;color:#1a1048;
       font-weight:900;font-size:26px;padding:16px 28px;border-radius:999px;box-shadow:0 8px 0 #c99a00,0 18px 40px rgba(0,0,0,.5);z-index:5;white-space:nowrap}
  .brand{position:absolute;top:44px;left:0;right:0;text-align:center;z-index:6;font-weight:900;font-size:22px;letter-spacing:3px;color:#fff;text-transform:uppercase}
  .brand b{color:#ffd23f}
  .lockup{position:absolute;left:0;right:0;bottom:418px;text-align:center;z-index:6;font-weight:900;font-size:44px;color:#fff;letter-spacing:-1px;text-shadow:0 6px 24px rgba(0,0,0,.5)}
  .lockup b{color:#ffd23f}
  .burst{position:absolute;z-index:4;color:#ffd23f;font-weight:900;font-size:40px}
</style>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<div id="bg"></div>
<div class="cap" id="cap"></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene_id = +(new URLSearchParams(location.search).get('s') || 1);
const W = 540, H = 960;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);
camera.position.set(0, 0.6, 16.5);
camera.lookAt(0, -2.2, 0);

scene.add(new THREE.HemisphereLight(0xbfb4ff, 0x1a1048, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x9b7bff, 2.0);
rim.position.set(-6, 3, -5);
scene.add(rim);

const floor = new THREE.Mesh(new THREE.CircleGeometry(5, 64), new THREE.ShadowMaterial({ opacity: 0.35 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -4.2;
floor.receiveShadow = true;
scene.add(floor);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.05, ...o });
const gold = mat(0xffc93c, { metalness: 0.85, roughness: 0.25 });
const purple = mat(0x7b5cff);
const white = mat(0xf4f1ff);
const dark = mat(0x22184d);
const red = mat(0xff4d6d);
const lime = mat(0x5cf2a6);

function add(mesh, parent = scene) {
  mesh.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  parent.add(mesh);
  return mesh;
}
function rbox(w, h, d, r, m) { return new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, r), m); }
function coin(r = 0.55) {
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.16, 48), gold);
  c.rotation.x = Math.PI / 2;
  g.add(c);
  const face = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.78, r * 0.78, 0.18, 48), mat(0xffb400, { metalness: 0.8, roughness: 0.3 }));
  face.rotation.x = Math.PI / 2;
  g.add(face);
  const tx = textTex('$', 256, 256, { size: 190, color: '#ffe9a3', bg: null });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(r * 1.4, r * 1.4), new THREE.MeshBasicMaterial({ map: tx, transparent: true }));
  p.position.z = 0.1;
  g.add(p);
  return g;
}
function textTex(text, w, h, { size = 80, color = '#fff', bg = '#000', weight = 900, radius = 0, lines = null } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  if (bg) {
    x.fillStyle = bg;
    x.beginPath(); x.roundRect(0, 0, w, h, radius); x.fill();
  }
  x.fillStyle = color;
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.font = `${weight} ${size}px "Inter Display", Inter, sans-serif`;
  (lines || [text]).forEach((t, i, a) => x.fillText(t, w / 2, h / 2 + (i - (a.length - 1) / 2) * size * 1.15));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function sparkles(n, spread, y0, seed = 1) {
  let s = seed;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.09 + rnd() * 0.08), mat(i % 2 ? 0xffd23f : 0xffffff, { emissive: i % 2 ? 0xffb400 : 0x8877ff, emissiveIntensity: 0.8 }));
    m.position.set((rnd() - 0.5) * spread, y0 + (rnd() - 0.5) * 3.2, (rnd() - 0.5) * 2);
    m.rotation.set(rnd() * 3, rnd() * 3, 0);
    scene.add(m);
  }
}

const cap = document.getElementById('cap');
function caption(lines, small) {
  cap.innerHTML = lines.map(l => `<span class="line">${l.replace(/\*(.+?)\*/g, '<span class="w hl pop">$1</span>')}</span>`).join('') +
    (small ? `<span class="line small">${small}</span>` : '');
}
function cta(text) {
  const d = document.createElement('div');
  d.className = 'cta'; d.textContent = text;
  document.body.appendChild(d);
}

// ---------- Scenes ----------
const scenes = {
  // 1. "Your 9–5 has a ceiling."  → income bars crushed against a glass ceiling
  1() {
    caption(['Your 9–5', 'has a *ceiling.*']);
    const heights = [1.2, 1.9, 2.5, 2.9, 2.9];
    heights.forEach((h, i) => {
      const b = add(rbox(0.8, h, 0.8, 0.12, i > 2 ? red : purple));
      b.position.set(-2.2 + i * 1.1, -4.2 + h / 2, 0);
    });
    const glass = add(rbox(6.4, 0.18, 2.4, 0.08, new THREE.MeshPhysicalMaterial({ color: 0xbfe8ff, roughness: 0.05, transparent: true, opacity: 0.45, metalness: 0, clearcoat: 1 })));
    glass.position.set(0.3, -1.18, 0);
    glass.rotation.z = -0.03;
    // crack shards popping off
    for (let i = 0; i < 6; i++) {
      const sh = add(new THREE.Mesh(new THREE.TetrahedronGeometry(0.14 + i * 0.02), new THREE.MeshPhysicalMaterial({ color: 0xbfe8ff, transparent: true, opacity: 0.7, roughness: 0.05 })));
      sh.position.set(1.4 + (i % 3) * 0.4, -0.7 + Math.floor(i / 3) * 0.45, 0.3);
      sh.rotation.set(i, i * 2, 0);
    }
    const arrow = add(new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.6, 32), red));
    arrow.position.set(2.2, -0.2, 0);
  },

  // 2. "You trade TIME for a paycheck."  → alarm clock + a lone coin
  2() {
    caption(['You trade', '*hours* for', 'a paycheck.']);
    const clock = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.8, 64), red);
    body.rotation.x = Math.PI / 2;
    clock.add(body);
    const face = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.35, 0.82, 64), white);
    face.rotation.x = Math.PI / 2;
    clock.add(face);
    for (let i = 0; i < 12; i++) {
      const t = new THREE.Mesh(new THREE.BoxGeometry(0.08, i % 3 ? 0.14 : 0.26, 0.05), dark);
      const a = (i / 12) * Math.PI * 2;
      t.position.set(Math.sin(a) * 1.15, Math.cos(a) * 1.15, 0.43);
      t.rotation.z = -a;
      clock.add(t);
    }
    const hh = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 0.05), dark); hh.position.set(0.15, 0.3, 0.46); hh.rotation.z = -0.5; clock.add(hh);
    const mh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.0, 0.05), dark); mh.position.set(-0.35, 0.38, 0.47); mh.rotation.z = 0.8; clock.add(mh);
    [-1, 1].forEach(sx => {
      const bell = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), gold);
      bell.position.set(sx * 1.05, 1.45, 0); bell.rotation.z = -sx * 0.6; clock.add(bell);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.06, 0.6), dark);
      leg.position.set(sx * 0.9, -1.65, 0); leg.rotation.z = sx * 0.4; clock.add(leg);
    });
    const hammer = new THREE.Mesh(new THREE.SphereGeometry(0.13), dark); hammer.position.set(0, 1.85, 0); clock.add(hammer);
    clock.position.set(-0.4, -2.25, 0);
    clock.rotation.set(0.08, 0.35, 0.12);
    add(clock);
    const c = add(coin(0.5));
    c.position.set(2.0, -3.6, 0.8);
    c.rotation.set(-0.2, -0.5, 0.3);
    // "ring" vibration marks
    [-1, 1].forEach(sx => {
      for (let k = 0; k < 2; k++) {
        const arc = add(new THREE.Mesh(new THREE.TorusGeometry(0.4 + k * 0.3, 0.04, 8, 32, Math.PI / 2.5), mat(0xffd23f, { emissive: 0xffb400, emissiveIntensity: 0.6 })));
        arc.position.set(-0.4 + sx * 1.6, -0.3, 0.2);
        arc.rotation.z = sx > 0 ? -0.3 : Math.PI - 0.3 + 0.6;
      }
    });
  },

  // 3. "Digital products sell while you sleep." → laptop at night with sale pop-ups & coins
  3() {
    caption(['Digital products', 'sell while', 'you *sleep.*']);
    const lap = new THREE.Group();
    const base = new THREE.Mesh(new RoundedBoxGeometry(3.6, 0.18, 2.4, 4, 0.08), mat(0xd9d4ee, { metalness: 0.6, roughness: 0.3 }));
    lap.add(base);
    const lid = new THREE.Group();
    const shell = new THREE.Mesh(new RoundedBoxGeometry(3.6, 2.4, 0.12, 4, 0.06), mat(0xd9d4ee, { metalness: 0.6, roughness: 0.3 }));
    shell.position.y = 1.2;
    lid.add(shell);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(3.3, 2.1), new THREE.MeshBasicMaterial({ map: textTex('', 660, 420, { bg: '#120c33', lines: [''] }) }));
    scr.position.set(0, 1.2, 0.07);
    lid.add(scr);
    const graph = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.2), new THREE.MeshBasicMaterial({ map: graphTex(), transparent: true }));
    graph.position.set(0, 1.15, 0.08);
    lid.add(graph);
    lid.position.set(0, 0.09, -1.15);
    lid.rotation.x = -0.18;
    lap.add(lid);
    lap.position.set(0, -3.6, 0);
    lap.rotation.set(0.15, -0.25, 0);
    add(lap);
    // sale notifications popping in
    const notes = ['💸 New sale  +$27', '💸 New sale  +$47', '💸 New sale  +$19'];
    notes.forEach((t, i) => {
      const n = add(rbox(2.5, 0.55, 0.1, 0.12, mat(0xffffff, { map: textTex(t, 500, 110, { size: 44, color: '#1a1048', bg: '#ffffff', radius: 26 }) })));
      n.position.set(-0.6 + (i % 2) * 1.1, -1.75 + i * 0.62, 0.6 + i * 0.1);
      n.rotation.set(0, -0.15, (i % 2 ? -1 : 1) * 0.06);
      n.scale.setScalar(1 - i * 0.04);
    });
    // moon + stars
    const moon = add(new THREE.Mesh(new THREE.SphereGeometry(0.75, 48, 32), mat(0xfff3c4, { emissive: 0xffe08a, emissiveIntensity: 0.35 })));
    moon.position.set(2.6, -0.9, -1.5);
    const bite = new THREE.Mesh(new THREE.SphereGeometry(0.7, 48, 32), new THREE.MeshBasicMaterial({ color: 0x241466 }));
    bite.position.set(2.95, -0.65, -1.2);
    scene.add(bite);
    [[-2, -0.9], [2.4, -1.8], [-2.4, 0.5], [1.5, 0.2]].forEach(([x, y], i) => {
      const c = add(coin(0.32));
      c.position.set(x, y - 1, 0.4);
      c.rotation.set(0.3 * i, 0.6 - i * 0.4, 0.2);
    });
  },

  // 4. "Make it once. Sell it forever." → product boxes duplicating
  4() {
    caption(['Make it *once.*', 'Sell it forever.']);
    const labels = [['E-BOOK', '#7b5cff'], ['TEMPLATE', '#ff4d6d'], ['COURSE', '#2bc48a']];
    const hero = new THREE.Group();
    labels.forEach(([l, c], i) => {
      const m = [mat(c), mat(c), mat(c), mat(c), mat(0xffffff, { map: textTex(l, 400, 520, { size: 62, color: '#fff', bg: c, lines: [l, '', '★★★★★'] }) }), mat(c)];
      const b = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.8, 0.35), m);
      b.position.set((i - 1) * 1.6, 0, i === 1 ? 0.4 : 0);
      b.rotation.y = (1 - i) * 0.25;
      hero.add(b);
    });
    hero.position.set(0, -2.1, 0);
    add(hero);
    // ghost copies stacking behind = "forever"
    for (let k = 1; k <= 4; k++) {
      const g = hero.clone();
      g.traverse(o => { if (o.isMesh) o.material = new THREE.MeshStandardMaterial({ color: 0x9b7bff, transparent: true, opacity: 0.32 - k * 0.06 }); });
      g.position.set(0, -2.1 + k * 0.05, -k * 1.4);
      g.scale.setScalar(1 - k * 0.04);
      scene.add(g);
    }
    // infinity loop under the products
    const curve = new (class extends THREE.Curve {
      getPoint(t) { const a = t * Math.PI * 2, s = Math.sin(a), c = Math.cos(a), d = 1 + s * s; return new THREE.Vector3(2.4 * c / d, 0, 2.4 * s * c / d); }
    })();
    const inf = add(new THREE.Mesh(new THREE.TubeGeometry(curve, 200, 0.09, 16, true), gold));
    inf.position.set(0, -3.75, 0.2);
    sparkles(10, 5.5, -1.5, 7);
  },

  // 5. "Your exit starts today." → rocket launch + CTA
  5() {
    caption(['Your exit', 'starts *today.*']);
    cta('Get the free Starter Kit ↓');
    const lk = document.createElement('div'); lk.className = 'lockup'; lk.innerHTML = 'Booked <b>&amp;</b> Paid'; document.body.appendChild(lk);
    const r = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.7, 2.4, 48), white); r.add(body);
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.62, 1.1, 48), red); nose.position.y = 1.75; r.add(nose);
    const win = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.07, 16, 40), mat(0xb8b8c8, { metalness: 0.9, roughness: 0.2 })); win.position.set(0, 0.45, 0.63); r.add(win);
    const glass = new THREE.Mesh(new THREE.CircleGeometry(0.28, 32), mat(0x6ec8ff, { emissive: 0x2a7fff, emissiveIntensity: 0.4 })); glass.position.set(0, 0.45, 0.64); r.add(glass);
    for (let i = 0; i < 3; i++) {
      const f = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.9, 0.7), red);
      const a = (i / 3) * Math.PI * 2;
      f.position.set(Math.sin(a) * 0.75, -0.95, Math.cos(a) * 0.75);
      f.rotation.y = a + Math.PI / 2;
      r.add(f);
    }
    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.4, 32), new THREE.MeshBasicMaterial({ color: 0xffb400 }));
    flame.rotation.x = Math.PI; flame.position.y = -1.95; r.add(flame);
    const core = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.9, 32), new THREE.MeshBasicMaterial({ color: 0xfff1b0 }));
    core.rotation.x = Math.PI; core.position.y = -1.7; r.add(core);
    r.position.set(0.2, -1.7, 0); r.scale.setScalar(0.8);
    r.rotation.set(0.1, 0.4, -0.35);
    add(r);
    // smoke puffs
    [[-0.6, -3.7, 0.55], [0.4, -3.9, 0.7], [-1.4, -3.95, 0.45], [1.3, -4.0, 0.5], [-0.2, -4.05, 0.6]].forEach(([x, y, s]) => {
      const p = add(new THREE.Mesh(new THREE.IcosahedronGeometry(s, 2), mat(0xe8e3ff, { roughness: 0.9 })));
      p.position.set(x + 0.7, y, 0);
    });
    sparkles(8, 5, -0.8, 3);
  },
};

function graphTex() {
  const c = document.createElement('canvas'); c.width = 520; c.height = 240;
  const x = c.getContext('2d');
  x.strokeStyle = '#5cf2a6'; x.lineWidth = 12; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath();
  [[20, 210], [110, 180], [190, 190], [270, 130], [350, 120], [430, 60], [500, 25]].forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b));
  x.stroke();
  x.fillStyle = '#5cf2a6'; x.beginPath(); x.arc(500, 25, 16, 0, Math.PI * 2); x.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

await document.fonts.load('900 50px "Inter Display"');
scenes[scene_id]();
// Keep 3D objects inside the Reels safe zone (14% top / 35% bottom are covered by app UI)
const fit = { 5: [0.55, -85] }[scene_id] || [0.8, 20];
renderer.domElement.style.transform = `translateY(${fit[1]}px) scale(${fit[0]})`;
renderer.render(scene, camera);
window.__done = true;
</script>
</body>
</html>
