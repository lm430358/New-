<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{--navy:#0b1433;--gold:#d4a83a;--gold-dark:#9c7a22;--cream:#f6f1e8}
  html,body{margin:0;width:540px;height:960px;overflow:hidden;background:var(--navy);font-family:"Playfair Display",serif}
  #bg{position:absolute;inset:0;background:radial-gradient(110% 70% at 50% 52%,#1d2b5c 0%,#0f1a3f 50%,#0a1129 100%)}
  canvas{position:absolute;inset:0;transform-origin:50% 50%}
  .cap{position:absolute;left:0;right:0;top:150px;text-align:center;padding:0 30px;z-index:5;display:none}
  .line{display:block;font-weight:900;font-size:50px;line-height:1.22;color:var(--cream);letter-spacing:-.5px;
        text-shadow:0 4px 0 rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45)}
  .w{display:inline-block;margin:10px 5px 4px;transform-origin:50% 80%;transform:scale(0)}
  .hl{background:var(--gold);color:var(--navy);padding:0 14px 4px;border-radius:12px;text-shadow:none;font-style:italic;
      box-shadow:0 6px 0 var(--gold-dark),0 14px 30px rgba(0,0,0,.4)}
  .cta{position:absolute;left:50%;bottom:336px;background:var(--gold);color:var(--navy);
       font-family:Inter,sans-serif;font-weight:800;font-size:25px;padding:16px 30px;border-radius:12px;
       box-shadow:0 7px 0 var(--gold-dark),0 18px 40px rgba(0,0,0,.5);z-index:5;white-space:nowrap;transform:translateX(-50%) scale(0)}
  .lockup{position:absolute;left:0;right:0;bottom:400px;text-align:center;z-index:6;color:var(--cream);text-shadow:0 6px 24px rgba(0,0,0,.5);transform:scale(0)}
  .lockup .n{font-weight:900;font-size:40px}
  .lockup .p{font-family:Inter,sans-serif;font-weight:600;font-size:20px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-top:4px}
  #flash{position:absolute;inset:0;background:#fff6dc;z-index:20;opacity:0;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<div id="bg"></div>
<div class="lockup" id="lockup"><div class="n">Go Solo Plan</div><div class="p">Booked &amp; Paid · $37</div></div>
<div class="cta" id="cta">Get the plan ↓</div>
<div id="flash"></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

await document.fonts.load('900 50px "Playfair Display"');
await document.fonts.load('700 30px "Playfair Display"');
await document.fonts.load('800 25px Inter');
await document.fonts.load('700 30px Inter');
const HOOK = new URLSearchParams(location.search).get('hook') || 'a';
const SCENE_LEN = 3, SCENES = 5, DURATION = SCENE_LEN * SCENES;
const W = 540, H = 960;
const NAVY = 0x0b1433, GOLD = 0xd4a83a, CREAM = 0xf6f1e8;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement, document.getElementById('lockup'));

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xfff4dd, 0x0b1433, 1.0));
const key = new THREE.DirectionalLight(0xfff1d6, 2.6);
key.position.set(4, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f8cff, 1.6);
rim.position.set(-6, 3, -5);
scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(5, 64), new THREE.ShadowMaterial({ opacity: 0.4 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -4.2;
floor.receiveShadow = true;
scene.add(floor);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.05, ...o });
const gold = mat(GOLD, { metalness: 0.85, roughness: 0.27 });
const cream = mat(CREAM);
const navy = mat(NAVY, { roughness: 0.3 });
const navy2 = mat(0x22306a);
const steel = mat(0xc9ced8, { metalness: 0.9, roughness: 0.25 });
const green = mat(0x2fb36b);

function add(mesh, parent) {
  mesh.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  parent.add(mesh);
  return mesh;
}
const rbox = (w, h, d, r, m) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, r), m);
function tex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const SERIF = '"Playfair Display", Georgia, serif', SANS = 'Inter, sans-serif';
function coin(r = 0.55, label = '$') {
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, r * 0.16, 64), gold);
  c.rotation.x = Math.PI / 2; g.add(c);
  const face = new THREE.Mesh(new THREE.CircleGeometry(r * 0.95, 64), mat(0xffffff, { metalness: 0.55, roughness: 0.35, map: tex(512, 512, (x, w) => {
    x.fillStyle = '#d4a83a'; x.fillRect(0, 0, w, w);
    x.strokeStyle = '#0b1433'; x.lineWidth = 5; x.beginPath(); x.arc(256, 256, 222, 0, 7); x.stroke();
    x.fillStyle = '#0b1433'; x.textAlign = 'center'; x.textBaseline = 'middle';
    if (label === 'B&P') {
      x.font = `900 150px ${SERIF}`; x.fillText('B&P', 256, 238);
      x.font = `700 26px ${SERIF}`; x.fillText('BOOKED & PAID', 256, 345);
    } else { x.font = `900 280px ${SERIF}`; x.fillText(label, 256, 270); }
  }) }));
  face.position.z = r * 0.081; g.add(face);
  const back = face.clone(); back.rotation.y = Math.PI; back.position.z = -r * 0.081; g.add(back);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 0.97, r * 0.02, 8, 64), gold);
  ring.position.z = r * 0.085; g.add(ring);
  return g;
}
function check(size = 1, m = green) {
  const g = new THREE.Group();
  const a = rbox(0.18 * size, 0.5 * size, 0.18 * size, 0.06 * size, m); a.position.set(-0.17 * size, -0.05 * size, 0); a.rotation.z = 0.75; g.add(a);
  const b = rbox(0.18 * size, 1.0 * size, 0.18 * size, 0.06 * size, m); b.position.set(0.17 * size, 0.18 * size, 0); b.rotation.z = -0.62; g.add(b);
  return g;
}
function sparkles(parent, n, spread, y0, seed = 1) {
  let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const list = [];
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.08 + rnd() * 0.08), mat(i % 2 ? GOLD : CREAM, { emissive: i % 2 ? 0x8a6a10 : 0x555555, emissiveIntensity: 0.6, metalness: 0.5 }));
    m.position.set((rnd() - 0.5) * spread, y0 + (rnd() - 0.5) * 3, (rnd() - 0.5) * 2);
    m.userData = { base: m.position.clone(), ph: rnd() * 6 };
    parent.add(m); list.push(m);
  }
  return lt => list.forEach(m => {
    m.rotation.set(lt * 2 + m.userData.ph, lt * 3, 0);
    m.position.y = m.userData.base.y + Math.sin(lt * 2 + m.userData.ph) * 0.15;
    const s = 0.6 + 0.4 * Math.sin(lt * 5 + m.userData.ph);
    m.scale.setScalar(Math.max(0, s));
  });
}

// ---------- timing helpers ----------
const clamp01 = x => Math.min(1, Math.max(0, x));
function backOut(x) { const c1 = 2.2, c3 = c1 + 1; x = clamp01(x); return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; }
const easeOut = x => 1 - (1 - clamp01(x)) ** 3;
const popAt = (lt, t0, dur = 0.32) => lt < t0 ? 0 : backOut((lt - t0) / dur);
const EVENTS = [];
const ev = (t, type) => EVENTS.push([+t.toFixed(3), type]);

// ---------- captions ----------
function makeCaption(lines, start, step = 0.13) {
  const el = document.createElement('div'); el.className = 'cap';
  const words = [];
  let i = 0;
  el.innerHTML = lines.map(l => '<span class="line">' + l.split(/(\*[^*]+\*)/).filter(Boolean).flatMap(part => {
    if (part.startsWith('*')) return [`<span class="w hl" data-i="${i++}" data-hl="1">${part.slice(1, -1)}</span>`];
    return part.trim().split(/\s+/).filter(Boolean).map(w => `<span class="w" data-i="${i++}">${w}</span>`);
  }).join('') + '</span>').join('');
  document.body.appendChild(el);
  el.querySelectorAll('.w').forEach(w => {
    const hl = !!w.dataset.hl, t0 = start + (+w.dataset.i) * step + (hl ? 0.08 : 0);
    words.push({ w, t0, hl });
  });
  return { el, words };
}
function animCaption(c, lt) {
  for (const { w, t0, hl } of c.words) {
    const s = popAt(lt, t0, hl ? 0.38 : 0.28);
    const rot = hl ? (1 - clamp01((lt - t0) / 0.4)) * -12 - 3 : 0;
    w.style.transform = `scale(${s.toFixed(4)}) rotate(${rot.toFixed(2)}deg)`;
  }
}

// ---------- scenes ----------
const defs = [];
function defScene(lines, fit, build, capStart = 0.05) {
  const G = new THREE.Group(); G.visible = false; scene.add(G);
  const idx = defs.length, T = idx * SCENE_LEN;
  const cap = makeCaption(lines, capStart);
  cap.words.forEach(({ t0, hl }) => { if (T + t0 >= 0) ev(T + t0, hl ? 'popbig' : 'pop'); });
  const anim = build(G, (t, type) => ev(T + t, type));
  defs.push({ G, cap, fit, anim });
}

// 1. Hook — tools feed coins into the boss's shop (already moving on frame 0)
defScene(HOOK === 'b' ? ['Good at the work.', '*Tired* of', 'the chase.'] : ['Still building', '*someone else’s*', 'business?'],
  [0.8, -15], (G, at) => {
  const shop = new THREE.Group();
  const body = rbox(2.8, 2.2, 1.8, 0.08, cream); body.position.y = 1.1; shop.add(body);
  const roof = rbox(3.1, 0.35, 2.0, 0.08, navy); roof.position.y = 2.35; shop.add(roof);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 0.55), new THREE.MeshBasicMaterial({ map: tex(460, 110, (x, w, h) => {
    x.fillStyle = '#0b1433'; x.fillRect(0, 0, w, h); x.fillStyle = '#d4a83a'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `900 46px ${SERIF}`; x.fillText('THE BOSS’S SHOP', w / 2, h / 2 + 4);
  }) }));
  sign.position.set(0, 2.0, 0.92); shop.add(sign);
  for (let i = 0; i < 7; i++) {
    const s = rbox(0.4, 0.12, 0.5, 0.04, i % 2 ? cream : gold);
    s.position.set(-1.2 + i * 0.4, 1.62, 1.05); s.rotation.x = 0.5; shop.add(s);
  }
  const door = rbox(0.75, 1.15, 0.08, 0.04, navy2); door.position.set(0.55, 0.58, 0.92); shop.add(door);
  const win = rbox(0.9, 0.7, 0.06, 0.04, mat(0x9fc3ff, { emissive: 0x2a4a8f, emissiveIntensity: 0.4, roughness: 0.1 }));
  win.position.set(-0.65, 0.85, 0.92); shop.add(win);
  shop.position.set(1.0, -4.2, -0.5); shop.rotation.y = -0.35;
  add(shop, G);
  const sc = new THREE.Group(), blades = [];
  [-1, 1].forEach(sx => {
    const half = new THREE.Group();
    const loop = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.07, 12, 32), gold); loop.position.set(sx * 0.24, -0.55, 0); half.add(loop);
    const blade = rbox(0.1, 1.2, 0.05, 0.03, steel); blade.position.set(sx * 0.06, 0.25, sx * 0.03); blade.rotation.z = sx * 0.22; half.add(blade);
    sc.add(half); blades.push([half, sx]);
  });
  sc.position.set(-1.7, -3.2, 1.1); sc.rotation.set(-0.3, 0.2, -0.4); sc.scale.setScalar(1.25);
  add(sc, G);
  const coins = [];
  for (let i = 0; i < 6; i++) { const c = add(coin(0.26), G); coins.push(c); }
  // a coin lands in the shop every 0.5s → "clink"
  for (let k = 0; k < 6; k++) at(0.35 + k * 0.5, 'clink');
  const tw = sparkles(G, 6, 5, -1.4, 3);
  return lt => {
    coins.forEach((c, i) => {
      const u = ((lt + 0.15) * 2 / 6 * 1.0 + i / 6) % 1;   // each coin loops every 3s, staggered
      c.position.set(-1.9 + u * 2.9, -2.3 + Math.sin(u * Math.PI) * 0.75, 0.8 - u * 0.7);
      c.rotation.set(0.2, lt * 6 + i, u * 4);
      c.scale.setScalar(u > 0.9 ? (1 - u) * 10 : 1);
    });
    blades.forEach(([h, sx]) => { h.rotation.z = sx * 0.18 * Math.abs(Math.sin(lt * 7)); });
    shop.position.y = -4.2 + Math.abs(Math.sin(lt * Math.PI * 2)) * 0.04;
    tw(lt);
  };
}, -0.35);

// 2. Go solo — checklist
defScene(['Go *solo.*'], [1.0, -15], (G, at) => {
  const board = new THREE.Group();
  board.add(rbox(3.2, 4.0, 0.16, 0.12, mat(0x8a5a2b, { roughness: 0.6 })));
  const items = ['Licensed', 'Insured', 'Priced right', 'First 10 clients'];
  const paper = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 3.5), mat(0xffffff, { roughness: 0.9, map: tex(560, 700, (x, w, h) => {
    x.fillStyle = '#f6f1e8'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#0b1433'; x.textAlign = 'left'; x.textBaseline = 'middle';
    x.font = `900 52px ${SERIF}`; x.fillText('Go Solo Plan', 44, 92);
    x.fillStyle = '#d4a83a'; x.fillRect(44, 132, 140, 6);
    items.forEach((it, i) => {
      const y = 225 + i * 120;
      x.strokeStyle = '#0b1433'; x.lineWidth = 5; x.strokeRect(44, y - 30, 60, 60);
      x.fillStyle = '#0b1433'; x.font = `700 44px ${SANS}`; x.fillText(it, 130, y + 2);
    });
  }) }));
  paper.position.z = 0.09; board.add(paper);
  const clip = rbox(1.2, 0.45, 0.22, 0.1, steel); clip.position.set(0, 2.0, 0.12); board.add(clip);
  const checks = items.map((_, i) => {
    const c = check(0.55); c.position.set(-1.0, 0.6 - i * 0.6, 0.3); board.add(c);
    const t0 = 0.75 + i * 0.4; at(t0, 'ding');
    return [c, t0];
  });
  board.position.set(0, -2.15, 0);
  add(board, G);
  at(0, 'whoosh');
  const tw = sparkles(G, 9, 5.5, -1.5, 5);
  return lt => {
    const s = popAt(lt, 0, 0.45);
    board.scale.setScalar(s);
    board.rotation.set(-0.08, 0.28 + Math.sin(lt * 1.2) * 0.08 + (1 - easeOut(lt / 0.5)) * 1.2, 0.05);
    checks.forEach(([c, t0]) => c.scale.setScalar(popAt(lt, t0, 0.3) * (1.12 - 0.12 * clamp01((lt - t0) / 0.6))));
    tw(lt);
  };
});

// 3. Get booked — calendar fills
defScene(['Get *booked.*'], [1.0, -15], (G, at) => {
  const cal = new THREE.Group();
  cal.add(rbox(4.2, 3.6, 0.3, 0.16, cream));
  const head = rbox(4.2, 0.75, 0.34, 0.16, navy); head.position.y = 1.45; cal.add(head);
  const ht = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.6), new THREE.MeshBasicMaterial({ transparent: true, map: tex(720, 120, (x, w, h) => {
    x.fillStyle = '#f6f1e8'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `900 66px ${SERIF}`; x.fillText('This week', w / 2, h / 2 + 4);
  }) }));
  ht.position.set(0, 1.45, 0.18); cal.add(ht);
  [-1.2, 1.2].forEach(x => { const r = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.05, 12, 24), steel); r.position.set(x, 1.9, 0); r.rotation.y = Math.PI / 2; cal.add(r); });
  const labelTex = tex(260, 100, (x, w, h) => { x.fillStyle = '#0b1433'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `800 40px ${SANS}`; x.fillText('BOOKED', w / 2, h / 2 + 2); });
  const order = [0, 5, 2, 10, 3, 8, 6, 11];
  const tiles = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
    const i = r * 4 + c, k = order.indexOf(i);
    const x = -1.43 + c * 0.95, y = 0.65 - r * 0.88;
    const empty = rbox(0.85, 0.72, 0.08, 0.08, mat(0xe4dccb)); empty.position.set(x, y, 0.18); cal.add(empty);
    if (k < 0) continue;
    const tg = new THREE.Group(); tg.position.set(x, y, 0.32);
    tg.add(rbox(0.85, 0.72, 0.22, 0.08, gold));
    const lbl = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.3), new THREE.MeshBasicMaterial({ transparent: true, map: labelTex })); lbl.position.z = 0.12; tg.add(lbl);
    cal.add(tg);
    const t0 = 0.55 + k * 0.22; at(t0, 'tick');
    tiles.push([tg, t0]);
  }
  cal.position.set(0, -2.1, 0);
  add(cal, G);
  at(0, 'whoosh');
  const tw = sparkles(G, 8, 5.5, -1.6, 9);
  return lt => {
    cal.scale.setScalar(popAt(lt, 0, 0.45));
    cal.rotation.set(-0.1, -0.3 + Math.sin(lt * 1.1) * 0.07, 0.03);
    tiles.forEach(([tg, t0]) => { const s = popAt(lt, t0, 0.3); tg.scale.setScalar(s); tg.position.z = 0.32 + (1 - clamp01((lt - t0) / 0.3)) * 0.8; });
    tw(lt);
  };
});

// 4. Get paid — phone notifications
defScene(['Get *paid.*'], [1.0, -15], (G, at) => {
  const ph = new THREE.Group();
  ph.add(rbox(2.3, 4.4, 0.22, 0.3, navy));
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 4.1), new THREE.MeshBasicMaterial({ map: tex(360, 720, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1d2b5c'); g.addColorStop(1, '#0b1433'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = '#f6f1e8'; x.textAlign = 'center'; x.font = `900 92px ${SERIF}`; x.fillText('9:41', w / 2, 170);
    x.font = `600 22px ${SANS}`; x.fillStyle = '#c8cfe6'; x.fillText('Saturday', w / 2, 210);
  }) }));
  scr.position.z = 0.115; ph.add(scr);
  add(ph, G);
  const notes = [['Deposit received', '+$40'], ['Paid in full', '+$120'], ['New booking', 'Sat 10:00']].map(([a, b], i) => {
    const n = add(rbox(2.9, 0.62, 0.1, 0.14, mat(0xffffff, { map: tex(580, 124, (x, w, h) => {
      x.fillStyle = '#ffffff'; x.beginPath(); x.roundRect(0, 0, w, h, 26); x.fill();
      x.fillStyle = '#d4a83a'; x.beginPath(); x.arc(52, h / 2, 26, 0, 7); x.fill();
      x.fillStyle = '#0b1433'; x.font = `900 30px ${SERIF}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('$', 52, h / 2 + 2);
      x.textAlign = 'left'; x.font = `700 32px ${SANS}`; x.fillText(a, 96, h / 2 + 1);
      x.textAlign = 'right'; x.fillStyle = '#1f8f55'; x.font = `800 32px ${SANS}`; x.fillText(b, w - 26, h / 2 + 1);
    }) })), G);
    n.position.set(i % 2 ? 0.45 : 0.05, -1.9 - i * 0.72, 0.9 - i * 0.1);
    n.rotation.set(0, -0.12, (i % 2 ? -1 : 1) * 0.04);
    const t0 = 0.6 + i * 0.55; at(t0, i < 2 ? 'cash' : 'ding');
    return [n, t0];
  });
  const coins = [[-1.9, -3.3, 0.3], [1.9, -1.1, 0.26], [1.7, -3.7, 0.34]].map(([x, y, r], i) => { const c = add(coin(r), G); c.position.set(x, y, 0.6); return [c, y, i]; });
  at(0, 'whoosh');
  return lt => {
    const e = easeOut(lt / 0.45);
    ph.position.set(-0.3, -2.25 - (1 - e) * 4, -0.6);
    ph.rotation.set(-0.05, -0.32 + Math.sin(lt * 1.3) * 0.06, 0.06);
    notes.forEach(([n, t0]) => n.scale.setScalar(popAt(lt, t0, 0.3)));
    coins.forEach(([c, y, i]) => { c.rotation.set(0.3, lt * 5 + i, 0.3); c.position.y = y + Math.sin(lt * 3 + i) * 0.12; c.scale.setScalar(popAt(lt, 0.9 + i * 0.25)); });
  };
});

// 5. Payoff — B&P medallion + CTA
const lockup = document.getElementById('lockup'), cta = document.getElementById('cta');
defScene(['Your skill.', 'Your *business.*'], [0.48, -50], (G, at) => {
  const m = add(coin(1.75, 'B&P'), G);
  m.position.set(0, -1.6, 0);
  at(0, 'whoosh'); at(0.85, 'cash'); at(1.25, 'popbig'); at(1.65, 'popbig');
  const tw = sparkles(G, 10, 5.5, -1.4, 11);
  return lt => {
    const e = easeOut(lt / 0.9);
    m.rotation.set(0.05, -0.38 + (1 - e) * Math.PI * 4 + Math.sin(lt * 1.5) * 0.1 * e, -0.1);
    m.scale.setScalar(popAt(lt, 0, 0.6));
    lockup.style.transform = `scale(${popAt(lt, 1.25, 0.35).toFixed(4)})`;
    const pulse = lt > 2.0 ? 1 + 0.05 * Math.sin((lt - 2.0) * 9) : 1;
    cta.style.transform = `translateX(-50%) scale(${(popAt(lt, 1.65, 0.4) * pulse).toFixed(4)})`;
    tw(lt);
  };
}, 0.1);

// transitions: whoosh + flash at each cut
for (let k = 1; k < SCENES; k++) ev(k * SCENE_LEN - 0.12, 'swoosh');

const flash = document.getElementById('flash');
window.EVENTS = EVENTS.sort((a, b) => a[0] - b[0]);
window.DURATION = DURATION;
window.renderAt = t => {
  const idx = Math.min(SCENES - 1, Math.floor(t / SCENE_LEN));
  const lt = t - idx * SCENE_LEN;
  defs.forEach((d, i) => { d.G.visible = i === idx; d.cap.el.style.display = i === idx ? 'block' : 'none'; });
  const show5 = idx === SCENES - 1;
  lockup.style.display = cta.style.display = show5 ? 'block' : 'none';
  const d = defs[idx];
  d.anim(lt);
  animCaption(d.cap, lt);
  // slow push-in, plus a small kick when the highlight word lands
  const hlT = (d.cap.words.find(w => w.hl) || { t0: -9 }).t0;
  const kick = lt > hlT ? Math.exp(-(lt - hlT) * 12) * Math.sin((lt - hlT) * 40) * 0.06 : 0;
  camera.position.set(kick, 0.6 + kick, 16.8 - lt * 0.35);
  camera.lookAt(0, -2.2, 0);
  // scene exit: quick zoom-out in the last 0.12s
  const out = clamp01((lt - (SCENE_LEN - 0.12)) / 0.12);
  const [fs, fy] = d.fit;
  renderer.domElement.style.transform = `translateY(${fy}px) scale(${(fs * (1 + out * 0.25)).toFixed(4)})`;
  // flash around each cut
  let f = 0;
  for (let k = 1; k < SCENES; k++) f = Math.max(f, 1 - Math.abs(t - k * SCENE_LEN) / 0.1);
  flash.style.opacity = (Math.max(0, f) * 0.55).toFixed(3);
  renderer.render(scene, camera);
};
window.__ready = true;
</script>
