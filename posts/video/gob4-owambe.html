<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#073b2e;font-family:Outfit,sans-serif;color:#fdf6e3}
#bg{position:absolute;inset:0;
 background:
  radial-gradient(circle at 50% 45%,rgba(212,166,64,.18),transparent 60%),
  linear-gradient(180deg,#0a4a39 0%,#062e24 100%)}
.border{position:absolute;left:0;right:0;height:120px;
 background:
  repeating-linear-gradient(45deg,#d4a640 0 18px,transparent 18px 36px),
  repeating-linear-gradient(-45deg,#b8322a 0 18px,#073b2e 18px 36px);
 background-blend-mode:normal;opacity:.95;
 -webkit-mask:repeating-linear-gradient(90deg,#000 0 60px,rgba(0,0,0,.55) 60px 120px)}
.border.t{top:0;border-bottom:6px solid #d4a640}.border.b{bottom:0;border-top:6px solid #d4a640}
.note{position:absolute;top:-200px;width:120px;height:56px;border-radius:6px;background:#9fc5a0;border:4px solid #e9f1dc;opacity:.2;
 box-shadow:inset 0 0 0 6px rgba(7,59,46,.25)}
.note::after{content:"$";position:absolute;inset:0;display:grid;place-items:center;font:800 30px Outfit;color:#2f5e3a}
#stage{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 110px;opacity:0}
.kick{font-weight:800;letter-spacing:10px;font-size:34px;color:#d4a640;margin-bottom:34px}
h1{font-family:"Playfair Display",serif;font-weight:900;font-size:132px;line-height:1.02}
h1 em{color:#d4a640}
.sub{font-size:54px;font-weight:600;margin-top:44px;line-height:1.25;color:#f3e7c9}
.num{font-family:"Playfair Display",serif;font-style:italic;font-size:220px;color:#d4a640;line-height:.9;margin-bottom:10px}
.tip h2{font-family:"Playfair Display",serif;font-weight:900;font-size:110px;line-height:1.04}
.tip .sub{font-size:52px;max-width:860px}
.card{margin-top:60px;background:rgba(253,246,227,.08);border:3px solid rgba(212,166,64,.6);border-radius:28px;padding:44px 50px;font-size:50px;line-height:1.3;max-width:880px}
.pill{display:inline-block;margin-top:56px;background:#d4a640;color:#073b2e;font-weight:800;font-size:46px;padding:26px 50px;border-radius:999px}
.handle{position:absolute;bottom:190px;left:0;right:0;text-align:center;font-weight:800;letter-spacing:6px;font-size:30px;color:#d4a640}
#progress{position:absolute;left:0;right:0;top:120px;height:8px;background:#d4a640;transform-origin:left}
</style></head><body>
<div id="bg"></div><div id="notes"></div>
<div class="border t"></div><div class="border b"></div><div id="progress"></div>
<div id="stage"></div>
<div class="handle">GoB4 · KNOW BEFORE YOU GO</div>
<script src="engine.js"></script>
<script>
// falling notes (looping, seekable)
const notes=document.getElementById('notes');
for(let i=0;i<16;i++){const n=document.createElement('div');n.className='note';
 n.style.left=(i*67+(i%3)*23)%1000+'px';notes.appendChild(n);
 const d=5200+(i*733)%3400, r=(i%2?1:-1)*(200+i*30);
 n.animate([{transform:`translateY(0) rotate(0deg)`},{transform:`translateY(2300px) rotate(${r}deg)`}],
  {duration:d,delay:-(i*911)%d,iterations:Infinity});}
const tip=(n,h,s)=>({dur:3.3,cls:"tip",html:`<div class="num" data-in="pop">${n}</div><h2 data-in>${h}</h2><div class="sub" data-in>${s}</div>`});
buildReel([
 {dur:3.2,html:`<div class="kick" data-in="drop">FIRST-TIMER'S GUIDE</div>
   <h1 data-in>Going to an <em>Owambe?</em></h1><div class="sub" data-in>Read this before you spray 💸</div>`},
 tip('01','Get crisp, new notes.','Hit the bank days before. Wrinkled bills are a no.'),
 tip('02','Spray, don’t throw.','Place it on the forehead or let it float down. Never slap it.'),
 tip('03','Wait for the dance.','Spray while they’re dancing, not while they eat or greet elders.'),
 tip('04','Leave the floor money.','Family or money-pickers collect it. Grabbing it looks like stealing.'),
 tip('05','Bring $1s and $5s.','Small notes last the whole song.'),
 {dur:3.6,html:`<div class="kick" data-in="drop">GOOD TO KNOW 🇳🇬</div>
   <h2 style="font-family:'Playfair Display';font-size:100px;line-height:1.05" data-in>Spraying naira is illegal in Nigeria.</h2>
   <div class="card" data-in>So hosts there use money-pickers or spray dollars instead.</div>`},
 {dur:3.4,last:true,html:`<h1 data-in style="font-size:116px">Save this for your next <em>owambe</em> ✨</h1>
   <div class="sub" data-in>Full guest checklist:</div><div class="pill" data-in="pop">gob4official.com</div>
   <div class="sub" data-in style="font-size:40px;color:#d4a640">@GoB4official</div>`},
]);
</script></body></html>
