<!doctype html><html><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Serif+Display&family=Inter:wght@500;700&display=swap');
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:Inter,sans-serif;color:#3b2a20;

.m{position:absolute;left:120px;top:0;bottom:0;width:4px;background:#c8623f}
.wrap{position:absolute;left:180px;right:90px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.num{font-family:Caveat,cursive;font-size:220px;color:#c8623f;line-height:.8}
h1{font-family:"DM Serif Display",serif;font-size:88px;line-height:1.08;margin:30px 0}
.cover h1{font-size:104px}
p{font-family:Caveat,cursive;font-size:72px;color:#5d6b3a;line-height:1.1}
em{color:#c8623f;font-style:normal}

.pg{position:absolute;top:60px;right:90px;font-weight:700;font-size:24px;letter-spacing:3px;color:#a08a70}
